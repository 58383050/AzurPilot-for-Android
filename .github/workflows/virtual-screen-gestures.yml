name: Virtual screen gestures

on:
  pull_request:
    paths:
      - 'app/app/src/main/kotlin/com/azurpilot/ghio/ui/**'
      - 'app/app/src/gestureTest/**'
      - 'app/navigation-runtime/**'
      - 'app/app/build.gradle.kts'
      - '.github/workflows/virtual-screen-gestures.yml'
  push:
    branches: [fix/android-virtual-screen-gesture-exclusion]

permissions:
  contents: read

jobs:
  kotlin:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-37" "build-tools;37.0.0"
      - name: Build UI-only gesture test APKs
        working-directory: app
        run: |
          bash gradlew :app:assembleDebug :app:assembleDebugAndroidTest \
            -PgestureTestsOnly=true -PoobeTestApplicationId=com.azurpilot.ghio.gesturetest \
            -x verifyBundledAzurPilotRuntime -x verifyBundledOcrRuntime \
            -x 'configureCMakeDebug[arm64-v8a]' -x 'buildCMakeDebug[arm64-v8a]' \
            -x 'configureCMakeDebug[x86_64]' -x 'buildCMakeDebug[x86_64]' --console=plain
      - name: Check patch whitespace
        run: git diff --check
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run three pager modes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          script: |
            adb install -r app/app/build/outputs/apk/debug/app-debug.apk
            adb install -r app/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            timeout 180 adb shell am instrument -w -r -e class com.azurpilot.ghio.ui.VirtualScreenPagerInstrumentedTest com.azurpilot.ghio.gesturetest.test/com.azurpilot.ghio.ui.GestureTestRunner | tee gesture-results.txt
            grep -q 'OK (3 tests)' gesture-results.txt
      - name: Upload instrumentation output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: virtual-screen-gesture-results
          path: gesture-results.txt
          if-no-files-found: ignore
