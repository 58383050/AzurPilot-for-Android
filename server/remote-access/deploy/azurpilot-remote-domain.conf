# 仅新增 remote.azurpilot.com 的虚拟主机；保留已有站点和证书。
# Adds only this hostname, preserving existing sites and certificates.
server {
    listen 80;
    listen [::]:80;
    server_name remote.azurpilot.com;
    location ^~ /.well-known/acme-challenge/ {
        root /opt/azurpilot-remote/acme-web;
    }
    location / {
        return 301 https://remote.azurpilot.com$request_uri;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name remote.azurpilot.com;
    ssl_certificate /opt/azurpilot-remote/acme-config/live/remote.azurpilot.com/fullchain.pem;
    ssl_certificate_key /opt/azurpilot-remote/acme-config/live/remote.azurpilot.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    location / {
        proxy_pass https://127.0.0.1:8443;
        proxy_ssl_server_name on;
        proxy_ssl_name ap-remote.108-186-180-52.sslip.io;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 20s;
    }
}
