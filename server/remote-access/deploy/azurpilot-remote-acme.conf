# 仅新增独立虚拟主机；不修改已有站点。
# Adds an independent virtual host without editing existing sites.
server {
    listen 80;
    listen [::]:80;
    server_name ap-remote.108-186-180-52.sslip.io;
    location ^~ /.well-known/acme-challenge/ {
        proxy_pass http://127.0.0.1:18883;
        proxy_set_header Host $host;
    }
    location / {
        return 301 https://ap-remote.108-186-180-52.sslip.io:8443$request_uri;
    }
}
